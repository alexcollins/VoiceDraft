name: Release

# Publishes to npm when a version tag is pushed:
#   npm version minor   # bumps package.json and tags v0.x.0
#   git push --follow-tags
#
# Needs the NPM_TOKEN repository secret (an npm "Automation" or granular
# token with publish rights to `voicedraft`). Once the package exists on
# npm, Trusted Publishing can replace the token: add this workflow as a
# trusted publisher on npmjs.com and delete the secret.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
